on:
  push:
    branches:
      - main
      - "develop/**"
    paths:
      - "Infrastructure/**"
      - "Sercices/**"
      - "APIGatway/**"
      - "docker-compose*.yml"
  pull_request:
    - main
    - "develop/**"
    

jobs:
  build-and-test:
    runs-on: ubuntu-latest # scalar value
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test
  