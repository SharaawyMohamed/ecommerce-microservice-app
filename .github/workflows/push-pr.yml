on:
  push:
    branches:
      - main
      - "develop/**"
    paths:
      - "Microservices-ECommerce/**"
      - ".github/workflows/push-pr.yml"
  pull_request:
    branches:
      - main
      - "develop/**"
    paths:
      - "Microservices-ECommerce/**"
      - ".github/workflows/push-pr.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest # scalar value
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Services/Catalog/Catalog.Application.Tests/Catalog.Application.Tests.csproj
        working-directory: Microservices-ECommerce

      - name: Build and run tests
        run: dotnet test Services/Catalog/Catalog.Application.Tests/Catalog.Application.Tests.csproj --no-restore
        working-directory: Microservices-ECommerce
  