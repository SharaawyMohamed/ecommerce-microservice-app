syntax = "proto3";

option csharp_namespace = "Discount.Application.Protos";

service DiscountProtoService{
   rpc CreateDiscount(CreateDiscountCommand) returns (CreateDiscountResponse);
   rpc UpdateDiscount(UpdateDiscountCommand) returns (UpdateDiscountResponse);
   rpc DeleteDiscount(DeleteDiscountCommand) returns (DeleteDiscountResponse);
   rpc GetDiscount(GetDiscountQuery) returns (GetDiscountResponse);
}

message CreateDiscountCommand{
  string productName = 1;
  string Description = 2;
  int32 amount = 3;
}
message CreateDiscountResponse{
  int32 Id = 1;
  string productName = 2;
  string Description = 3;
  int32 amount = 4;
}
message UpdateDiscountCommand{
  int32 Id = 1;
  string productName = 2;
  string Description = 3;
  int32 amount = 4;
}	
message UpdateDiscountResponse{
  bool isUpdated = 1;
}
message DeleteDiscountCommand{
  string productName = 1;
}
message DeleteDiscountResponse{
  bool isDeleted = 1;
}
message GetDiscountQuery{
  string productName = 1;
}
message GetDiscountResponse{
  int32 Id = 1;
  string productName = 2;
  string Description = 3;
  int32 amount = 4;
}
