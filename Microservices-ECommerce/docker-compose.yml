services:
  rabbitmq:
    image: rabbitmq:3-management-alpine 
    container_name: rabbitmq-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: securepassword123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_listener", "5672"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    container_name: catalog_mongo
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - backend-net
    healthcheck: 
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: basket_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    container_name: discount_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DiscountDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Services/Discount/Discount.Infrustructure/Data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DiscountDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqlserver:
    container_name: ordering_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!P@ssw0rd2026"
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1433:1433"
    networks:
      - backend-net
    healthcheck: 
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!P@ssw0rd2026' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog.api:
    container_name: catalog_api
    image: ${DOCKER_REGISTRY:-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongo:27017
      MongoDbSettings__DatabaseName: CatalogDb
    ports:
      - "8081:8080"
    networks:
      - backend-net

  basket.api:
    container_name: basket_api
    image: ${DOCKER_REGISTRY:-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      discount.api:
        condition: service_started
      rabbitmq:
        condition: service_healthy 
    environment:
      ASPNETCORE_URLS: http://+:8080
      CacheSettings__ConnectionString: redis:6379
      GrpcSettings__DiscountUrl: http://discount.api:8082
      EventBusSettings__HostAddress: "amqp://admin:securepassword123@rabbitmq:5672" 
    ports:
      - "8080:8080"
    networks:
      - backend-net

  discount.api:
    container_name: discount_api
    image: ${DOCKER_REGISTRY:-}discountapi
    build:
      context: .
      dockerfile: Services/Discount/Discount.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=DiscountDb;Username=postgres;Password=postgres
    ports:
      - "8082:8080"
    networks:
      - backend-net

  ordering.api:
    container_name: ordering_api
    image: ${DOCKER_REGISTRY:-}orderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderingDb;User Id=sa;Password=Str0ng!P@ssw0rd2026;TrustServerCertificate=True"
      EventBusSettings__HostAddress: "amqp://admin:securepassword123@rabbitmq:5672"
    ports:
      - "8083:8080"
    networks:
      - backend-net

volumes:
  rabbitmq_data:
  mongodb_data:
  redis_data:
  postgres_data:
  sqlserver_data:

networks:
  backend-net:
    driver: bridge