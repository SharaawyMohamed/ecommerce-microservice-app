services:
  mongo:
    container_name: catalog_mongo
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  redis:
    container_name: basket_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  postgres:
    container_name: discount_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DiscountDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Services/Discount/Discount.Infrustructure/Data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  catalog.api:
    container_name: catalog_api
    image: ${DOCKER_REGISTRY:-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    depends_on:
      - mongo
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - MongoDbSettings__ConnectionString=mongodb://mongo:27017
      - MongoDbSettings__DatabaseName=CatalogDb
    ports:
      - "8081:8080"

  basket.api:
    container_name: basket_api
    image: ${DOCKER_REGISTRY:-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CacheSettings__ConnectionString=redis:6379
    ports:
      - "8080:8080"

  discount.api:
    container_name: discount_api
    image: ${DOCKER_REGISTRY:-}discountapi
    build:
      context: .
      dockerfile: Services/Discount/Discount.API/Dockerfile
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=DiscountDb;Username=postgres;Password=postgres
    ports:
      - "8082:8080"
    

volumes:
  mongodb_data:
  redis_data:
  postgres_data: